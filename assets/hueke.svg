<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hueke's icon: a dollar sign, with a badge at its lower right: a bird's head cut out of a
       solid flame, for 火雞 ("fire chicken"). A gap around the badge separates it from the dollar
       sign. Obsidian draws icons on a 100 × 100 canvas; the color comes from the surrounding
       text (currentColor). Every copy of the icon defines the same ids, so sharing them is
       harmless. -->
  <defs>
    <!-- Flame on its own 100 × 100 canvas: a tall tongue and a small one on the right -->
    <path id="hueke-icon-flame" d="M50 94 C28 94 12 80 12 61 C12 39 33 26 42 4 C56 17 67 24 71 32 C73 26 73 21 71 15 C83 24 89 43 88 63 C86 81 71 94 50 94 Z"/>
    <!-- The gap around the badge -->
    <mask id="hueke-icon-dollar-mask">
      <rect width="100" height="100" fill="#fff"/>
      <use href="#hueke-icon-flame" transform="translate(44 41) scale(0.6)" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
    </mask>
    <!-- Bird's head in the flame's coordinates: head and beak -->
    <mask id="hueke-icon-flame-mask">
      <rect width="100" height="100" fill="#fff"/>
      <g fill="#000">
        <circle cx="52" cy="63" r="25"/>
        <path d="M31 57.5 L19 63 L31 68.5 Z" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>
  <!-- Dollar sign -->
  <g mask="url(#hueke-icon-dollar-mask)"><path transform="translate(34 40) scale(0.88) translate(-39 -44)" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M60 24 C56 15 48 12 39 12 C28 12 20 18 20 28 C20 40 32 42 40 44 C50 46 60 50 60 62 C60 72 50 76 39 76 C29 76 21 72 18 64 M39 4 V84"/></g>
  <!-- Badge: the flame with the bird's head, and the eye -->
  <g transform="translate(44 41) scale(0.6)">
    <use href="#hueke-icon-flame" mask="url(#hueke-icon-flame-mask)" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="43" cy="56" r="4.5" fill="currentColor"/>
  </g>
</svg>
